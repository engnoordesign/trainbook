<!doctype html>
<html lang="en" dir="ltr" data-theme="light" data-super="0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TrainBook</title>
  <meta name="description" content="TrainBook - a simple bodyweight training notebook. دفتر التمرين: دفتر تمارينك اليومي.">
  <meta name="theme-color" content="#f4f5f8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TrainBook">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <!-- set language / theme before first paint (no flash). Per-profile data is encrypted, so the red Super Day theme is applied after sign-in. -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('trainbook.dev') || 'null');
        if (!s) { var old = JSON.parse(localStorage.getItem('trainbook.v1') || 'null') || {}; s = { lang: old.lang, theme: old.theme }; }
        var lang = s.lang === 'ar' || s.lang === 'en' ? s.lang : (/^ar/i.test(navigator.language || '') ? 'ar' : 'en');
        var th = s.theme === 'light' || s.theme === 'dark' ? s.theme : 'auto';
        if (th === 'auto') th = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var r = document.documentElement;
        r.lang = lang; r.dir = lang === 'ar' ? 'rtl' : 'ltr'; r.dataset.theme = th; r.dataset.super = '0';
      } catch (e) { }
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="nav" id="nav"></aside>
    <main class="main">
      <header class="top" id="top"></header>
      <div id="view" aria-live="polite"></div>
    </main>
  </div>
  <div id="auth" class="auth" hidden></div>
  <div id="pill"></div>
  <aside id="music" class="mdock" aria-label="Music" hidden></aside>
  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <noscript><p class="noscript">TrainBook needs JavaScript. / يحتاج دفتر التمرين إلى تفعيل جافاسكريبت.</p></noscript>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/vault.js"></script>
  <script src="js/store.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/ui-core.js"></script>
  <script src="js/music-data.js"></script>
  <script src="js/library.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/views.js"></script>
  <script src="js/music.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/figure.js"></script>
  <script src="js/poses.js"></script>
  <script src="js/guides.js"></script>
  <script src="js/guides-1.js"></script>
  <script src="js/guides-2.js"></script>
  <script src="js/guides-3.js"></script>
  <script src="js/guides-courses.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/merge.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/account.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
