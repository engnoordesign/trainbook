# TrainBook - static PWA served by nginx (unprivileged image, port 8080)
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # text compression
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/css text/plain application/javascript application/json application/manifest+json image/svg+xml;

  # security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Always revalidate (cheap 304s). This makes updates reach users immediately;
  # the service worker already gives instant loads + offline use.
  add_header Cache-Control "no-cache" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  # no account service in this image (it lives in the Cloudflare Worker): say so clearly instead of returning the web page
  location /api/ {
    default_type application/json;
    return 404 '{"error":"no_account_service"}';
  }

  # Cloudflare-only file, not meant to be served here
  location = /_headers {
    return 404;
  }

  # hash-based routing (#/today ...) means every real URL is a file; fall back to the app shell just in case
  location / {
    try_files $uri $uri/ /index.html;
  }
}
